<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DJ JDiaz — Song Request</title>
<style>
  :root{
    --ink:#141016;
    --panel:#1c1720;
    --panel-2:#241d29;
    --brass:#c9973a;
    --brass-light:#f0cb7a;
    --rose:#b5586f;
    --paper:#f4ede1;
    --paper-dim:#cfc4b3;
    --line:#3a3140;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, rgba(201,151,58,0.18), transparent 55%),
      var(--ink);
    color:var(--paper);
    font-family:Georgia,'Palatino Linotype',serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
  }
  .card{
    width:100%;
    max-width:480px;
  }
  /* header */
  .eyebrow{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
  }
  .brand{
    font-family:Georgia,serif;
    font-size:12px;
    letter-spacing:3px;
    text-transform:uppercase;
    color:var(--paper-dim);
  }
  .lang-toggle{
    display:flex;
    border:1px solid var(--line);
    border-radius:999px;
    overflow:hidden;
    font-family:system-ui,-apple-system,sans-serif;
  }
  .lang-toggle button{
    background:transparent;
    border:none;
    color:var(--paper-dim);
    font-size:11px;
    letter-spacing:1px;
    padding:6px 12px;
    cursor:pointer;
    font-weight:600;
  }
  .lang-toggle button.active{
    background:var(--brass);
    color:var(--ink);
  }

  /* vinyl signature */
  .vinyl-wrap{
    display:flex;
    align-items:center;
    gap:16px;
    margin-bottom:6px;
  }
  .vinyl{
    width:46px;height:46px;flex:none;
    border-radius:50%;
    background:
      radial-gradient(circle at 50% 50%, var(--brass) 0 6px, #0b090c 7px 9px, #17131a 10px 22px);
    position:relative;
    box-shadow:0 0 0 1px rgba(255,255,255,0.04);
  }
  .vinyl::after{
    content:"";
    position:absolute; inset:0;
    border-radius:50%;
    background:repeating-radial-gradient(circle at 50% 50%, transparent 0 2px, rgba(255,255,255,0.03) 3px 4px);
  }
  .vinyl.spin{ animation:spin 2.4s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg);} }

  h1{
    font-size:34px;
    line-height:1.1;
    margin:0 0 4px;
    color:var(--paper);
    font-weight:400;
  }
  .subtitle{
    font-family:system-ui,-apple-system,sans-serif;
    font-size:14px;
    color:var(--paper-dim);
    line-height:1.5;
    margin:0 0 26px;
  }
  .subtitle strong{ color:var(--brass-light); font-weight:600; }

  label{
    display:block;
    font-family:system-ui,-apple-system,sans-serif;
    font-size:11px;
    letter-spacing:1.5px;
    text-transform:uppercase;
    color:var(--paper-dim);
    margin:0 0 6px;
  }
  .field{ margin-bottom:18px; }
  input[type=text]{
    width:100%;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    color:var(--paper);
    font-family:system-ui,-apple-system,sans-serif;
    font-size:16px;
    padding:13px 14px;
    outline:none;
  }
  input[type=text]:focus{ border-color:var(--brass); }
  input[type=text]::placeholder{ color:#6b6270; }

  /* search + results */
  .search-box{ position:relative; }
  .results{
    margin-top:8px;
    border-radius:10px;
    overflow:hidden;
    border:1px solid var(--line);
    background:var(--panel);
    display:none;
  }
  .results.show{ display:block; }
  .result-row{
    display:flex;
    align-items:center;
    gap:12px;
    padding:10px 12px;
    border-bottom:1px solid var(--line);
    cursor:pointer;
    font-family:system-ui,-apple-system,sans-serif;
  }
  .result-row:last-child{ border-bottom:none; }
  .result-row:hover, .result-row:active{ background:var(--panel-2); }
  .result-row img{
    width:40px;height:40px;border-radius:4px;flex:none;
    background:var(--ink);
  }
  .result-text{ min-width:0; }
  .result-title{
    color:var(--paper);
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .result-artist{
    color:var(--paper-dim);
    font-size:12px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .search-hint{
    font-family:system-ui,-apple-system,sans-serif;
    font-size:12px;
    color:#6b6270;
    margin-top:6px;
  }

  /* selected track chip */
  .selected{
    display:none;
    align-items:center;
    gap:12px;
    background:var(--panel-2);
    border:1px solid var(--brass);
    border-radius:10px;
    padding:12px;
    margin-top:10px;
  }
  .selected.show{ display:flex; }
  .selected img{ width:44px;height:44px;border-radius:4px; }
  .selected .sel-text{ flex:1; min-width:0; font-family:system-ui,-apple-system,sans-serif; }
  .selected .sel-title{ color:var(--brass-light); font-size:14px; font-weight:600; }
  .selected .sel-artist{ color:var(--paper-dim); font-size:12px; }
  .clear-btn{
    background:none; border:none; color:var(--paper-dim);
    font-size:20px; line-height:1; cursor:pointer; padding:4px;
  }

  .groove{
    height:1px;
    margin:26px 0;
    background:repeating-linear-gradient(to right, var(--line) 0 6px, transparent 6px 10px);
  }

  button.submit{
    width:100%;
    background:var(--brass);
    color:var(--ink);
    border:none;
    border-radius:10px;
    font-family:system-ui,-apple-system,sans-serif;
    font-weight:700;
    font-size:15px;
    letter-spacing:0.5px;
    padding:15px;
    cursor:pointer;
  }
  button.submit:disabled{
    background:#5a4f39;
    color:#948a76;
    cursor:not-allowed;
  }
  button.submit:active:not(:disabled){ background:var(--brass-light); }

  .status{
    font-family:system-ui,-apple-system,sans-serif;
    font-size:13px;
    text-align:center;
    margin-top:12px;
    color:var(--paper-dim);
  }
  .status.error{ color:var(--rose); }

  /* success ticket */
  .ticket{
    display:none;
    background:var(--panel);
    border:1px dashed var(--brass);
    border-radius:12px;
    padding:22px;
    text-align:center;
  }
  .ticket.show{ display:block; }
  .ticket .stamp{
    font-family:system-ui,-apple-system,sans-serif;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--brass-light);
    margin-bottom:10px;
  }
  .ticket .tt{ font-size:22px; color:var(--paper); margin-bottom:4px; }
  .ticket .ta{ font-family:system-ui,-apple-system,sans-serif; font-size:13px; color:var(--paper-dim); margin-bottom:16px;}
  .ticket .again{
    font-family:system-ui,-apple-system,sans-serif;
    font-size:13px;
    color:var(--brass-light);
    text-decoration:underline;
    cursor:pointer;
    background:none;border:none;
  }

  .form-wrap{ display:block; }
  .form-wrap.hide{ display:none; }
</style>
</head>
<body>

<div class="card">

  <div class="eyebrow">
    <div class="brand">DJ JDiaz · Fort Worth</div>
    <div class="lang-toggle">
      <button id="btn-en" class="active" onclick="setLang('en')">EN</button>
      <button id="btn-es" onclick="setLang('es')">ES</button>
    </div>
  </div>

  <div class="vinyl-wrap">
    <div class="vinyl" id="vinyl"></div>
    <div>
      <h1 id="t-title">Request a Song</h1>
    </div>
  </div>
  <p class="subtitle" id="t-subtitle">
    Search by <strong>song title or artist</strong> and pick the exact match from the list —
    that way I play the version you actually mean.
  </p>

  <div class="form-wrap" id="form-wrap">

    <div class="field">
      <label id="l-name">Your name</label>
      <input type="text" id="guestName" placeholder="e.g. Maria" placeholder-en="e.g. Maria" placeholder-es="p. ej. María">
    </div>

    <div class="field search-box">
      <label id="l-search">Song or artist</label>
      <input type="text" id="songSearch" autocomplete="off" placeholder="Start typing..." placeholder-en="Start typing..." placeholder-es="Empieza a escribir...">
      <div class="results" id="results"></div>
      <div class="search-hint" id="t-hint">Results come from the iTunes catalog.</div>

      <div class="selected" id="selected">
        <img id="selImg" src="" alt="">
        <div class="sel-text">
          <div class="sel-title" id="selTitle"></div>
          <div class="sel-artist" id="selArtist"></div>
        </div>
        <button class="clear-btn" onclick="clearSelection()">×</button>
      </div>
    </div>

    <div class="field">
      <label id="l-note">Note <span style="text-transform:none;letter-spacing:0;">(optional)</span></label>
      <input type="text" id="guestNote" placeholder="e.g. it's my quinceañera!" placeholder-en="e.g. it's my quinceañera!" placeholder-es="p. ej. ¡es mi quince!">
    </div>

    <div class="groove"></div>

    <button class="submit" id="submitBtn" onclick="submitRequest()" disabled>
      <span id="t-submit">Add to the Queue</span>
    </button>
    <div class="status" id="status"></div>
  </div>

  <div class="ticket" id="ticket">
    <div class="stamp" id="t-stamp">On the list</div>
    <div class="tt" id="ticketTitle"></div>
    <div class="ta" id="ticketArtist"></div>
    <button class="again" id="t-again" onclick="resetForm()">Request another song</button>
  </div>

</div>

<!-- Hidden real form + iframe: delivers data to Zapier as a normal form POST,
     avoiding all the CORS quirks that come with JS fetch(). -->
<iframe name="hidden_target" style="display:none;"></iframe>
<form id="zapierForm" method="POST" target="hidden_target" style="display:none;">
  <input type="hidden" name="guestName">
  <input type="hidden" name="note">
  <input type="hidden" name="songTitle">
  <input type="hidden" name="artist">
  <input type="hidden" name="album">
  <input type="hidden" name="artworkUrl">
  <input type="hidden" name="language">
  <input type="hidden" name="submittedAt">
</form>

<script>
/* ============================================================
   CONFIG — paste your Zapier "Catch Hook" webhook URL below.
   Zapier: create a Zap, trigger = Webhooks by Zapier → Catch Hook,
   copy the URL it gives you, paste it here between the quotes.
   ============================================================ */
const ZAPIER_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbwInwSK4YSXKN4mnX-67gSOLL2SzpgNs6aWbufz9JY1t1mONH3zPz0slSSAZLTD9ev2/exec";

const STRINGS = {
  en: {
    title: "Request a Song",
    subtitle: 'Search by <strong>song title or artist</strong> and pick the exact match from the list — that way I play the version you actually mean.',
    name: "Your name",
    search: "Song or artist",
    hint: "Results come from the iTunes catalog.",
    note: 'Note <span style="text-transform:none;letter-spacing:0;">(optional)</span>',
    submit: "Add to the Queue",
    stamp: "On the list",
    again: "Request another song",
    sending: "Sending...",
    sent: "Got it — thanks!",
    errNoConfig: "This form isn't fully set up yet. Ask the event DJ.",
    errSend: "Couldn't send that — check your connection and try again.",
    errName: "Enter your name first.",
    errSong: "Pick a song from the search results.",
    searchBusy: "Still searching — give it a few seconds and keep typing."
  },
  es: {
    title: "Pide una Canción",
    subtitle: 'Busca por <strong>título o artista</strong> y elige la opción exacta de la lista — así pongo la versión que tú quieres.',
    name: "Tu nombre",
    search: "Canción o artista",
    hint: "Los resultados vienen del catálogo de iTunes.",
    note: 'Nota <span style="text-transform:none;letter-spacing:0;">(opcional)</span>',
    submit: "Añadir a la Fila",
    stamp: "En la lista",
    again: "Pedir otra canción",
    sending: "Enviando...",
    sent: "¡Recibido, gracias!",
    errNoConfig: "Este formulario aún no está listo. Pregúntale al DJ.",
    errSend: "No se pudo enviar. Revisa tu conexión e intenta de nuevo.",
    errName: "Escribe tu nombre primero.",
    errSong: "Elige una canción de los resultados.",
    searchBusy: "Todavía buscando — espera unos segundos y sigue escribiendo."
  }
};

let currentLang = 'en';
let selectedTrack = null;
let searchTimer = null;

document.getElementById('zapierForm').action = ZAPIER_WEBHOOK_URL;

function setLang(lang){
  currentLang = lang;
  document.getElementById('btn-en').classList.toggle('active', lang==='en');
  document.getElementById('btn-es').classList.toggle('active', lang==='es');
  const s = STRINGS[lang];
  document.getElementById('t-title').textContent = s.title;
  document.getElementById('t-subtitle').innerHTML = s.subtitle;
  document.getElementById('l-name').textContent = s.name;
  document.getElementById('l-search').textContent = s.search;
  document.getElementById('t-hint').textContent = s.hint;
  document.getElementById('l-note').innerHTML = s.note;
  document.getElementById('t-submit').textContent = s.submit;
  document.getElementById('t-stamp').textContent = s.stamp;
  document.getElementById('t-again').textContent = s.again;

  document.querySelectorAll('[placeholder-en]').forEach(el=>{
    el.setAttribute('placeholder', el.getAttribute('placeholder-'+lang));
  });
}

document.getElementById('songSearch').addEventListener('input', (e)=>{
  clearTimeout(searchTimer);
  const term = e.target.value.trim();
  clearSelection();
  if(term.length < 2){
    hideResults();
    return;
  }
  searchTimer = setTimeout(()=> runSearch(term), 400);
});

const searchCache = {};

async function runSearch(term){
  const vinyl = document.getElementById('vinyl');
  const key = term.toLowerCase();
  if(searchCache[key]){
    renderResults(searchCache[key]);
    return;
  }
  vinyl.classList.add('spin');
  try{
    const url = `/.netlify/functions/search?term=${encodeURIComponent(term)}`;
    const res = await fetch(url);
    const data = await res.json();
    const results = data.results || [];
    searchCache[key] = results;
    renderResults(results);
  }catch(err){
    showSearchError();
  }finally{
    vinyl.classList.remove('spin');
  }
}

function showSearchError(){
  const box = document.getElementById('results');
  const s = STRINGS[currentLang];
  box.innerHTML = `<div style="padding:14px;font-family:system-ui,-apple-system,sans-serif;font-size:13px;color:#cfc4b3;text-align:center;">${s.searchBusy}</div>`;
  box.classList.add('show');
}

function renderResults(tracks){
  const box = document.getElementById('results');
  if(!tracks.length){
    hideResults();
    return;
  }
  box.innerHTML = tracks.map((t, i) => `
    <div class="result-row" onclick="selectTrack(${i})">
      <img src="${t.artworkUrl60 || ''}" alt="">
      <div class="result-text">
        <div class="result-title">${escapeHtml(t.trackName || '')}</div>
        <div class="result-artist">${escapeHtml(t.artistName || '')} · ${escapeHtml(t.collectionName || '')}</div>
      </div>
    </div>
  `).join('');
  box.classList.add('show');
  window._lastResults = tracks;
}

function hideResults(){
  const box = document.getElementById('results');
  box.classList.remove('show');
  box.innerHTML = '';
}

function selectTrack(i){
  const t = window._lastResults[i];
  selectedTrack = t;
  document.getElementById('selImg').src = t.artworkUrl60 || '';
  document.getElementById('selTitle').textContent = t.trackName || '';
  document.getElementById('selArtist').textContent = `${t.artistName || ''} · ${t.collectionName || ''}`;
  document.getElementById('selected').classList.add('show');
  document.getElementById('songSearch').value = '';
  hideResults();
  updateSubmitState();
}

function clearSelection(){
  selectedTrack = null;
  document.getElementById('selected').classList.remove('show');
  updateSubmitState();
}

function updateSubmitState(){
  document.getElementById('submitBtn').disabled = !selectedTrack;
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

async function submitRequest(){
  const s = STRINGS[currentLang];
  const statusEl = document.getElementById('status');
  const name = document.getElementById('guestName').value.trim();
  const note = document.getElementById('guestNote').value.trim();

  statusEl.classList.remove('error');

  if(!name){
    statusEl.textContent = s.errName;
    statusEl.classList.add('error');
    return;
  }
  if(!selectedTrack){
    statusEl.textContent = s.errSong;
    statusEl.classList.add('error');
    return;
  }
  if(!ZAPIER_WEBHOOK_URL || ZAPIER_WEBHOOK_URL.indexOf('PASTE_YOUR') === 0){
    statusEl.textContent = s.errNoConfig;
    statusEl.classList.add('error');
    return;
  }

  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  statusEl.textContent = s.sending;

  const payload = {
    guestName: name,
    note: note,
    songTitle: selectedTrack.trackName || '',
    artist: selectedTrack.artistName || '',
    album: selectedTrack.collectionName || '',
    artworkUrl: selectedTrack.artworkUrl100 || selectedTrack.artworkUrl60 || '',
    language: currentLang,
    submittedAt: new Date().toISOString()
  };

  const form = document.getElementById('zapierForm');
  for(const key in payload){
    if(form.elements[key]) form.elements[key].value = payload[key];
  }

  const iframe = document.querySelector('iframe[name="hidden_target"]');
  let done = false;
  const finish = () => {
    if(done) return;
    done = true;
    iframe.removeEventListener('load', finish);
    showTicket(payload);
  };
  iframe.addEventListener('load', finish);
  // Fallback in case the load event doesn't fire as expected
  setTimeout(finish, 2500);

  form.submit();
}

function showTicket(payload){
  document.getElementById('form-wrap').classList.add('hide');
  document.getElementById('ticketTitle').textContent = payload.songTitle;
  document.getElementById('ticketArtist').textContent = payload.artist;
  document.getElementById('ticket').classList.add('show');
}

function resetForm(){
  document.getElementById('guestNote').value = '';
  document.getElementById('songSearch').value = '';
  clearSelection();
  document.getElementById('status').textContent = '';
  document.getElementById('ticket').classList.remove('show');
  document.getElementById('form-wrap').classList.remove('hide');
}
</script>
</body>
</html>
